[project]
name = "agentclaw"
version = "6.1.0"
description = "AgentClaw v6.1 — 纯 Python + DeepSeek + LangGraph 实现的 AI Agent 框架"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: 单元测试（快速，无外部依赖）",
    "integration: 集成测试（需要网络或外部服务）",
    "slow: 耗时测试",
    "security: 安全相关测试",
]
log_cli = false
log_cli_level = "WARNING"

[tool.coverage.run]
source = [
    "core",
    "tools.registry",
    "tools.builtin",
    "tools.registry_adapter",
    "agent.core",
    "tools.searcher",
    "tools.vision",
    "tools.image_gen",
    "tools.multimodal_router",
    "api.server",
    "tools.health",
    "tools.security",
    "learning.feedback",
    "learning.learner",
    "learning.evolution",
    "learning.optimizer",
]
branch = true
parallel = true
omit = [
    "test/*",
    "*/__pycache__/*",
    "*/deprecated*",
    "server/*",
    "scripts/main.py",
    "demo/ui.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass$",
    "except ImportError:",
    "# pragma: no branch",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"
title = "AgentClaw v6.1 测试覆盖率报告"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E501"]
